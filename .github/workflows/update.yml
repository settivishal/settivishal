name: Update profile card

on:
  schedule:
    - cron: "17 4 * * *"   # daily, 04:17 UTC — off-the-hour to avoid GitHub's load spike
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - update_profile.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}   # optional: a PAT with repo scope, for private-repo stats
        run: python update_profile.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --staged --quiet || git commit -m "chore: update profile stats"
          git push  